<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Celestial Birthday Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The decoy -->
  <main id="landing" class="card">
    <p class="glyphs" aria-hidden="true">☾ ✦ ☉ ✦ ☽</p>
    <h1>Celestial Birthday Reader</h1>
    <p class="subtitle">Enter your birthday to reveal your Western and Chinese zodiac.</p>

    <form id="birthday-form" novalidate>
      <label for="birthday">Date of birth</label>
      <input id="birthday" name="birthday" type="date" min="1900-01-01" required>
      <button type="submit" id="submit">Read the stars</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>
  </main>

  <!-- The jump scare -->
  <div id="scare" class="scare" hidden>
    <img class="ghoul" src="assets/scary-anime-white-creepy-face-77575efixwlhmwp1.webp" alt="">
  </div>

  <!-- The afterlife -->
  <div id="crypt" class="crypt" hidden>
    <div class="crypt-bg"></div>
    <div id="darkness" class="darkness"></div>
    <div class="void"></div>
    <div id="flame" class="flame" aria-hidden="true"></div>

    <div class="crypt-content">
      <p id="death-message" class="death-message"></p>

      <section id="omen-modal" class="omen-modal" role="dialog" aria-labelledby="omen-title" hidden>
        <h2 id="omen-title" tabindex="-1">Your Fate Is Sealed</h2>

        <div id="omen-sections" class="omen-sections">
          <article class="omen-section">
            <h3>Horoscope</h3>
            <p id="horoscope"></p>
          </article>

          <article class="omen-section">
            <h3>Historical Death</h3>
            <img id="death-photo" class="death-photo" alt="" hidden>
            <p class="death-name"><span id="death-name"></span> <span id="death-year" class="death-year"></span></p>
            <p id="death-desc" class="death-desc"></p>
            <p id="death-extract"></p>
            <a id="death-link" class="death-link" target="_blank" rel="noopener" hidden>Read their story</a>
          </article>

          <article class="omen-section">
            <h3>Dark Omen</h3>
            <p id="omen"></p>
          </article>
        </div>

        <p id="crypt-error" class="crypt-error" role="alert" hidden></p>
        <button id="rise" type="button" class="rise">Rise again</button>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
